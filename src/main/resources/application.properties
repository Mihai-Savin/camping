spring.application.name=camp-reservations

# H2 file-based database so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/campdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

server.port=${PORT:8081}

# Free Groq API key for AI-generated campsite descriptions (console.groq.com)
groq.api-key=${GROQ_API_KEY:}

# Resend API key for reservation notification emails to campsite owners (resend.com)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
