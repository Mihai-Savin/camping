<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Owner Account — Pinewood Camp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div class="page-header">
    <h1>Create an Owner Account</h1>
  </div>

  <div class="card" style="max-width: 420px;">
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="field">
        <label for="displayName">Your name</label>
        <input type="text" id="displayName" th:field="*{displayName}" required>
        <div class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <button type="submit" class="btn btn-ember">Create Account</button>
    </form>

    <p class="small-note" style="margin-top:1rem;">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</main>

<footer>Pinewood Camp Reservations</footer>
</body>
</html>
