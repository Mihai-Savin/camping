<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Reservations — Pinewood Camp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div th:replace="~{fragments/common :: alerts}"></div>

  <div class="page-header">
    <h1>Reservations for My Campsites</h1>
  </div>

  <table th:if="${not #lists.isEmpty(reservations)}">
    <thead>
      <tr>
        <th>Campsite</th>
        <th>Guest</th>
        <th>Check-in</th>
        <th>Check-out</th>
        <th>Guests</th>
        <th>Total</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${reservations}">
        <td><a th:href="@{/campsites/{id}(id=${r.campsite.id})}" th:text="${r.campsite.name}">Site</a></td>
        <td>
          <div th:text="${r.guestName}">Guest</div>
          <div class="small-note" th:text="${r.guestEmail}">email</div>
        </td>
        <td th:text="${r.checkIn}">2026-01-01</td>
        <td th:text="${r.checkOut}">2026-01-03</td>
        <td th:text="${r.numberOfGuests}">2</td>
        <td th:text="'$' + ${r.totalPrice}">$80</td>
        <td>
          <span class="badge confirmed" th:if="${r.status.name() == 'CONFIRMED'}" th:text="${r.status}">CONFIRMED</span>
          <span class="badge cancelled" th:if="${r.status.name() == 'CANCELLED'}" th:text="${r.status}">CANCELLED</span>
        </td>
        <td>
          <form th:action="@{/my/reservations/{id}/cancel(id=${r.id})}" method="post"
                th:if="${r.status.name() == 'CONFIRMED'}"
                onsubmit="return confirm('Cancel this reservation?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger">Cancel</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="empty-state" th:if="${#lists.isEmpty(reservations)}">
    <p>No reservations yet for your campsites.</p>
  </div>
</main>

<footer>Pinewood Camp Reservations</footer>
</body>
</html>
