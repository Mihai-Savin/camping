<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${campsiteId != null} ? 'Edit Campsite' : 'Add Campsite'">Campsite Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div class="page-header">
    <h1 th:text="${campsiteId != null} ? 'Edit Campsite' : 'Add a New Campsite'">Campsite Form</h1>
  </div>

  <div class="card">
    <form th:action="${campsiteId != null} ? @{/campsites/{id}(id=${campsiteId})} : @{/campsites}"
          th:object="${campsiteForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required>
        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <div class="actions-row" th:if="${campsiteId == null}" style="margin-bottom:0.5rem;">
          <button type="button" id="generateDescriptionBtn" class="btn btn-outline">Generate description</button>
          <span id="generateDescriptionStatus" class="small-note"></span>
        </div>
        <textarea id="description" th:field="*{description}" required></textarea>
        <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>

      <div class="field">
        <label for="capacity">Capacity (max guests)</label>
        <input type="number" id="capacity" min="1" th:field="*{capacity}" required>
        <div class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
      </div>

      <div class="field">
        <label for="pricePerNight">Price per night ($)</label>
        <input type="number" step="0.01" min="0.01" id="pricePerNight" th:field="*{pricePerNight}" required>
        <div class="field-error" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></div>
      </div>

      <div class="field">
        <label for="amenities">Amenities (optional)</label>
        <input type="text" id="amenities" th:field="*{amenities}" placeholder="Fire pit, picnic table, water hookup">
      </div>

      <div class="field">
        <label for="imageUrl">Photo URL (optional)</label>
        <input type="url" id="imageUrl" th:field="*{imageUrl}" placeholder="https://example.com/photo.jpg">
        <div class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="active" th:field="*{active}">
        <label for="active">Active (bookable by guests)</label>
      </div>

      <button type="submit" class="btn btn-ember" th:text="${campsiteId != null} ? 'Save Changes' : 'Add Campsite'">Save</button>
    </form>
  </div>
</main>

<script th:if="${campsiteId == null}" th:inline="javascript">
(function () {
  var csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
  var csrfToken = /*[[${_csrf.token}]]*/ '';

  var btn = document.getElementById('generateDescriptionBtn');
  var status = document.getElementById('generateDescriptionStatus');
  var nameInput = document.getElementById('name');
  var descriptionField = document.getElementById('description');
  if (!btn) return;

  btn.addEventListener('click', function () {
    var name = nameInput.value.trim();
    if (!name) {
      status.textContent = 'Enter a campsite name first.';
      status.style.color = 'var(--danger)';
      return;
    }

    btn.disabled = true;
    status.style.color = '';
    status.textContent = 'Looking it up and writing a description…';

    var headers = { 'Content-Type': 'application/json' };
    headers[csrfHeader] = csrfToken;

    fetch('/campsites/generate-description', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ name: name })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (result.ok) {
          descriptionField.value = result.data.description;
          status.textContent = 'Description generated — feel free to edit it.';
        } else {
          status.textContent = result.data.error || 'Something went wrong. Please write a description manually.';
          status.style.color = 'var(--danger)';
        }
      })
      .catch(function () {
        status.textContent = 'Network error. Please write a description manually.';
        status.style.color = 'var(--danger)';
      })
      .finally(function () {
        btn.disabled = false;
      });
  });
})();
</script>

<footer>Pinewood Camp Reservations</footer>
</body>
</html>
