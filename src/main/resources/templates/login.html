<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Log In — Pinewood Camp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div class="page-header">
    <h1>Owner Log In</h1>
  </div>

  <div class="card" style="max-width: 420px;">
    <div th:replace="~{fragments/common :: alerts}"></div>
    <div class="alert alert-error" th:if="${param.error}">Incorrect email or password.</div>
    <div class="alert alert-success" th:if="${param.logout}">You've been logged out.</div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="field">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-ember">Log In</button>
    </form>

    <p class="small-note" style="margin-top:1rem;">
      New campsite owner? <a href="/register">Create an account</a>
    </p>
  </div>
</main>

<footer>Pinewood Camp Reservations</footer>
</body>
</html>
