<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header class="site-header" th:fragment="nav">
    <a class="brand" href="/">🏕️ Pinewood Camp Reservations</a>
    <nav>
      <a href="/">Campsites</a>
      <a href="/reservations">Find My Reservations</a>
      <th:block th:if="${currentOwner != null}">
        <a href="/my/campsites">My Campsites</a>
        <a href="/my/reservations">My Reservations</a>
        <a href="/my/account">My Account</a>
        <span class="account-name">
          <svg class="account-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9Z"/>
          </svg>
          <span th:text="${currentOwner.displayName}">Owner</span>
        </span>
        <form th:action="@{/logout}" method="post" style="display:inline;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="btn btn-outline" style="color:#eef3ea; border-color:#eef3ea;">Log Out</button>
        </form>
      </th:block>
      <th:block th:if="${currentOwner == null}">
        <a href="/login">Log In</a>
        <a href="/register">Sign Up</a>
      </th:block>
    </nav>
  </header>

  <div th:fragment="alerts">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
  </div>
</body>
</html>
