<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Account — Pinewood Camp</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div th:replace="~{fragments/common :: alerts}"></div>

  <div class="page-header">
    <h1>My Account</h1>
  </div>

  <div class="card" style="max-width: 420px;">
    <form th:action="@{/my/account}" th:object="${accountForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="field">
        <label for="displayName">Your name</label>
        <input type="text" id="displayName" th:field="*{displayName}" required>
        <div class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>
      </div>

      <div class="field">
        <label for="phone">Phone (optional, for SMS reservation alerts)</label>
        <input type="tel" id="phone" th:field="*{phone}" placeholder="+15551234567">
      </div>

      <button type="submit" class="btn btn-ember">Save Changes</button>
    </form>
  </div>
</main>

<footer>Pinewood Camp Reservations</footer>
</body>
</html>
