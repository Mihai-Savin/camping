<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rear Camp Reservations</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: nav}"></div>

<main>
  <div th:replace="~{fragments/common :: alerts}"></div>

  <div class="page-header">
    <h1>Available Campsites</h1>
  </div>

  <div class="grid" th:if="${not #lists.isEmpty(campsites)}">
    <div class="card campsite-card" th:each="site : ${campsites}">
      <img class="campsite-card-image" th:if="${site.imageUrl}" th:src="${site.imageUrl}"
           th:alt="${site.name}" onerror="this.style.display='none'">
      <h2 th:text="${site.name}">Campsite name</h2>
      <div class="meta">
        <span th:if="${site.facilityType}" th:text="${site.facilityType.name()} + ' ·'">TENT ·</span>
        Sleeps <span th:text="${site.capacity}">4</span> ·
        <span class="price" th:text="'$' + ${site.pricePerNight} + ' / night'">$40 / night</span>
      </div>
      <p th:text="${#strings.abbreviate(site.description, 140)}">Description</p>
      <a class="btn" th:href="@{/campsites/{id}(id=${site.id})}">View &amp; Book</a>
    </div>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(campsites)}">
    <p>No campsites are available right now. Check back soon, or add one to get started.</p>
    <a class="btn btn-ember" href="/campsites/new">Add the first campsite</a>
  </div>
</main>

<footer>Rear Camp Reservations</footer>
</body>
</html>
