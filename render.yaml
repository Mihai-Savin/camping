databases:
  - name: camp-reservations-db
    plan: free
    databaseName: campdb
    user: campapp

services:
  - type: web
    name: camp-reservations
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TRIAL_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: camp-reservations-db
          property: connectionString
