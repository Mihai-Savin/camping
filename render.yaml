databases:
  - name: camp-reservations-db
    plan: free
    databaseName: campdb
    user: campapp

services:
  - type: web
    name: camp-reservations
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: NOTIFICATIONS_SERVICE_URL
        value: https://campsite-notifications.onrender.com
      - key: NOTIFICATIONS_SERVICE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: camp-reservations-db
          property: connectionString
